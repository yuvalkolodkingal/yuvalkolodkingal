name: Refresh profile

# Rebuilds the data-driven panels every day and whenever the config or the
# engine changes. The built-in GITHUB_TOKEN is enough: it reads the public
# API at 1000 requests an hour, and `contents: write` lets the job commit.
#
# The refresh commit is authored by github-actions[bot] on purpose, so the
# daily job does not paint the contribution graph it is drawing. Pushes made
# with GITHUB_TOKEN never trigger other workflows, so no [skip ci] is needed.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "profile.toml"
      - "skills/github-profile-designer/scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/github-profile-designer/scripts/requirements.txt

      - run: pip install -r skills/github-profile-designer/scripts/requirements.txt

      - name: Fetch data, render panels, update README blocks, check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python skills/github-profile-designer/scripts/build.py all

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile data"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/*.json assets/*.svg README.md"
