name: CI

# Keeps the engine, the installer and the committed page honest on every
# change: the SVGs must parse and pass the check rules, the installer must
# lint and survive a dry run, and a fresh profile must build from the skill.

"on":
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r skills/github-profile-designer/scripts/requirements.txt
      - name: Config, assets and README pass the checks
        run: python skills/github-profile-designer/scripts/build.py check --strict
      - name: Profile review checker audits the committed page
        run: python skills/github-profile-review/scripts/check_readme.py README.md --fetch-images
      - name: Panels render offline from profile.toml
        run: python skills/github-profile-designer/scripts/build.py render --static
      - name: A new profile scaffolds and builds from the skill
        run: |
          mkdir -p /tmp/fresh && cd /tmp/fresh
          python "$GITHUB_WORKSPACE/skills/github-profile-designer/scripts/build.py" init --username octocat --name "Mona"
          python "$GITHUB_WORKSPACE/skills/github-profile-designer/scripts/build.py" all --no-fetch
      - name: Installer lints and dry-runs
        run: |
          sudo apt-get install -y -qq shellcheck dash >/dev/null
          shellcheck -s sh install.sh
          dash -n install.sh
          HOME=$(mktemp -d) dash install.sh --from ./skills --dry-run --all
          HOME=$(mktemp -d) sh -c 'dash ./install.sh --from ./skills --agents claude && test -f "$HOME/.claude/skills/github-profile-designer/SKILL.md" && dash ./install.sh --uninstall && test ! -e "$HOME/.claude/skills/github-profile-designer"'
