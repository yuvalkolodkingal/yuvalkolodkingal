name: Refresh profile
# engine-path: {{engine}}

# Rebuilds the data-driven panels every day and whenever the config changes.
# The built-in GITHUB_TOKEN is enough: it reads the public API at 1000
# requests an hour, and `contents: write` lets the job commit the new SVGs.

"on":
  schedule:
    - cron: "17 6 * * *"   # daily, ~06:17 UTC; pick your own minute
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "profile.toml"
      - "{{engine}}/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: {{engine}}/requirements.txt

      - run: pip install -r {{engine}}/requirements.txt

      - name: Fetch data, render panels, update README blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python {{engine}}/build.py all

      # Authored by the bot on purpose: a job that commits as you paints a
      # square on your contribution graph every day.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/*.json assets/*.svg README.md"
